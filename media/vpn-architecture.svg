<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted WireGuard VPN architecture</title>
  <desc id="desc">Laptop, phone and tablet connect through a WireGuard tunnel to a VPS protected by a firewall, local management API and DNS.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08161d"/><stop offset="1" stop-color="#12383c"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#7dded4" stop-opacity=".3"/><stop offset=".6" stop-color="#9df4e4"/><stop offset="1" stop-color="#7dded4" stop-opacity=".3"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b8ebe4" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="735" cy="470" r="280" fill="#53e0cc" opacity=".045" filter="url(#glow)"/>
  <text x="90" y="104" fill="#8bd7d0" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="8">PRIVATE NETWORK / SYSTEM ARCHITECTURE</text>
  <text x="90" y="180" fill="#f1f7f3" font-family="Arial,sans-serif" font-size="59" font-weight="700">Self-hosted VPN</text>
  <text x="90" y="226" fill="#a8c4bf" font-family="Arial,sans-serif" font-size="23">Stock WireGuard at the core. Secure operations around it.</text>
  <g stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M346 398H590"/><path d="M346 532H590"/><path d="M346 666H590"/>
    <path d="M860 532H1050"/>
  </g>
  <g fill="#9df4e4"><circle cx="466" cy="398" r="5"/><circle cx="480" cy="532" r="5"/><circle cx="450" cy="666" r="5"/><circle cx="955" cy="532" r="5"/></g>
  <g font-family="Arial,sans-serif">
    <g fill="#10262b" stroke="#9de6dc" stroke-opacity=".45" stroke-width="2">
      <rect x="90" y="344" width="256" height="108" rx="16"/><rect x="90" y="478" width="256" height="108" rx="16"/><rect x="90" y="612" width="256" height="108" rx="16"/>
      <rect x="590" y="336" width="270" height="384" rx="24" fill="#15383b" stroke="#b3f2e6" stroke-opacity=".85" stroke-width="3"/>
      <rect x="1050" y="335" width="300" height="388" rx="24"/>
    </g>
    <text x="123" y="391" fill="#e6f5ef" font-size="27" font-weight="700">Laptop</text><text x="123" y="421" fill="#8fbab4" font-size="17">local private key</text>
    <text x="123" y="525" fill="#e6f5ef" font-size="27" font-weight="700">Phone</text><text x="123" y="555" fill="#8fbab4" font-size="17">device enrollment</text>
    <text x="123" y="659" fill="#e6f5ef" font-size="27" font-weight="700">Tablet</text><text x="123" y="689" fill="#8fbab4" font-size="17">kill-switch aware</text>
    <text x="628" y="404" fill="#8ff0df" font-size="17" font-weight="700" letter-spacing="5">ENCRYPTED TUNNEL</text>
    <text x="628" y="479" fill="#f4faf6" font-size="43" font-weight="700">WireGuard</text>
    <text x="628" y="522" fill="#b9d7d0" font-size="24">on a private VPS</text>
    <path d="M626 560H824" stroke="#8bc7be" stroke-opacity=".4"/>
    <text x="628" y="603" fill="#bdd9d3" font-size="19">standard protocol</text>
    <text x="628" y="634" fill="#bdd9d3" font-size="19">narrow privileged agent</text>
    <text x="628" y="665" fill="#bdd9d3" font-size="19">revocable peers</text>
    <text x="1086" y="402" fill="#8ff0df" font-size="17" font-weight="700" letter-spacing="4">OPERATIONS</text>
    <text x="1086" y="465" fill="#edf8f3" font-size="25">nftables firewall</text>
    <text x="1086" y="524" fill="#edf8f3" font-size="25">management API</text>
    <text x="1086" y="583" fill="#edf8f3" font-size="25">Unbound DNS</text>
    <text x="1086" y="642" fill="#edf8f3" font-size="25">client CLI</text>
  </g>
  <text x="90" y="823" fill="#7daaa4" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">ARCHITECTURE ILLUSTRATION · BASED ON THE PROJECT REPOSITORY</text>
</svg>
